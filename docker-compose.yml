version: '3.8'

services:
  kiro-gateway:
    build:
      context: .
      dockerfile: Dockerfile
    image: kiro-gateway:latest
    ports:
      - "${SERVER_PORT:-8000}:${SERVER_PORT:-8000}"
    environment:
      # Server configuration
      - SERVER_HOST=0.0.0.0
      - SERVER_PORT=${SERVER_PORT:-8000}
      
      # Required: Set your proxy API key
      # You can also use .env file (see env_file below)
      - PROXY_API_KEY=${PROXY_API_KEY:-my-super-secret-password-123}
      
      # Authentication (choose one method)
      # Option 1: Refresh token
      - REFRESH_TOKEN=${REFRESH_TOKEN:-}
      
      # Option 2: Profile ARN (optional, for Kiro IDE)
      - PROFILE_ARN=${PROFILE_ARN:-}
      
      # Option 3: Credentials file path (mounted as volume below)
      - KIRO_CREDS_FILE=${KIRO_CREDS_FILE:-}
      
      # Option 4: kiro-cli SQLite database (mounted as volume below)
      - KIRO_CLI_DB_FILE=${KIRO_CLI_DB_FILE:-}
      
      # Optional settings
      - KIRO_REGION=${KIRO_REGION:-us-east-1}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - DEBUG_MODE=${DEBUG_MODE:-errors}
      
      # VPN/Proxy settings (for restricted networks)
      - VPN_PROXY_URL=${VPN_PROXY_URL:-}

    # NOTE: env_file is intentionally NOT set here. Each instance loads its
    # own env file via a per-project docker-compose override generated by
    # start.sh. To enable substitution of ${VAR:-default} above, start.sh
    # sources the env file into the shell before invoking docker-compose.

    volumes:
      # Mount credentials file (if using KIRO_CREDS_FILE)
      # KIRO_SSO_CACHE_HOST_DIR points to the host directory containing the
      # kiro-auth-token.json file referenced by KIRO_CREDS_FILE. Default is
      # the standard AWS CLI SSO cache location. Override in .env per instance
      # to point at a different user's credentials directory.
      - ${KIRO_SSO_CACHE_HOST_DIR:-${HOME}/.aws/sso/cache}:/home/kiro/.aws/sso/cache:ro

      # Mount kiro-cli database (if using KIRO_CLI_DB_FILE)
      # Uncomment and adjust path as needed:
      # - ${KIRO_CLI_DB_HOST_DIR:-~/.local/share/kiro-cli}:/home/kiro/.local/share/kiro-cli  # Linux/macOS

      # Mount debug logs directory (optional, for debugging)
      - ${KIRO_DEBUG_LOGS_HOST_DIR:-./debug_logs}:/app/debug_logs

    restart: unless-stopped

    # Health check
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:${SERVER_PORT:-8000}/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    
    # Resource limits (recommended for production)
    # Adjust based on your workload and available resources
    deploy:
      resources:
        limits:
          cpus: '2'        # Maximum CPU cores (streaming can be CPU-intensive)
          memory: 1G       # Maximum memory (sufficient for FastAPI + streaming)
        reservations:
          cpus: '0.5'      # Minimum guaranteed CPU
          memory: 256M     # Minimum guaranteed memory

networks:
  default:
    # No hardcoded name: each project gets its own auto-named network so
    # multiple instances (zzk, kidd, ...) can coexist without collision.
